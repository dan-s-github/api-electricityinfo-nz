[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electricityinfo-nz"
version = "0.1.0"
description = "Python client for the WITS Market Prices API (Electricity Info NZ)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["electricity", "wits", "market-prices", "new-zealand", "api"]
dependencies = [
  "requests>=2.31.0",
  "python-dateutil>=2.8.2"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.12",
  "flake8>=6.1",
  "mypy>=1.8",
  "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/api-electricityinfo-nz"
Repository = "https://github.com/yourusername/api-electricityinfo-nz.git"
Issues = "https://github.com/yourusername/api-electricityinfo-nz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_unreachable = true
ignore_missing_imports = true
