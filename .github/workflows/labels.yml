name: Sync Github labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      # Creates missing labels and updates existing ones; never deletes labels.
      - name: Sync config with Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import subprocess
          import tomllib

          with open(".github/labels.toml", "rb") as f:
              labels = tomllib.load(f)

          for label in labels.values():
              subprocess.run(
                  [
                      "gh", "label", "create", label["name"],
                      "--color", label["color"],
                      "--description", label.get("description", ""),
                      "--force",
                  ],
                  check=True,
              )
